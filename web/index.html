<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>GyroRacer Controller</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

<style>
:root {
  --bg: #0a0d16;
  --panel: #151c2f;
  --panel-2: #101625;
  --line: #2b3658;
  --text: #edf2ff;
  --muted: #9ba8cf;
  --primary: #4f8dff;
  --danger: #ff5c70;
  --ok: #6ee7b7;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 50% -10%, #1e2d52 0%, var(--bg) 44%);
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}

#ui {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100vw;
  height: 100vh;
  box-sizing: border-box;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px calc(env(safe-area-inset-bottom, 0px) + 8px);
}

#topBar {
  width: min(92vw, 620px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 2vmin;
  margin-bottom: 2vmin;
}

.groupLabel {
  font-size: 3.1vmin;
  color: var(--muted);
  letter-spacing: .02em;
}

.btnRow {
  display: flex;
  gap: 3vmin;
}

.topBtn {
  width: 14vmin;
  height: 14vmin;
  min-width: 54px;
  min-height: 54px;
  border-radius: 50%;
  background: linear-gradient(180deg, #243055 0%, #1b2340 100%);
  border: 2px solid #3f4f80;
  box-shadow: 0 8px 20px rgba(0, 0, 0, .28);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 6vmin;
  font-weight: 650;
  color: #fff;
  user-select: none;
  touch-action: none;
  pointer-events: auto;
  transition: transform .08s, box-shadow .08s, background .12s;
}

.topBtn.down {
  background: linear-gradient(180deg, #4a7fff 0%, #2d63df 100%);
  transform: scale(.93);
  box-shadow: 0 4px 14px rgba(29, 81, 212, .5);
}

#wheelWrap {
  width: min(72vmin, 400px);
  height: min(72vmin, 400px);
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin-top: 1vmin;
  background: radial-gradient(circle at 50% 48%, #1d2640 0%, #0f1426 72%);
  border: 2px solid #2f3c63;
  box-shadow: 0 20px 46px rgba(0, 0, 0, .45), inset 0 0 40px rgba(37, 55, 102, .25);
}

#wheel {
  width: 62vmin;
  height: 62vmin;
  max-width: 345px;
  max-height: 345px;
  border: 7px solid #4f628f;
  border-radius: 50%;
  background: url('data:image/svg+xml;utf8,\
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">\
<circle cx="50" cy="50" r="48" fill="%23131a2f"/>\
<circle cx="50" cy="50" r="36" fill="none" stroke="%232f3d67" stroke-width="4"/>\
<line x1="50" y1="50" x2="50" y2="7" stroke="%238da8ff" stroke-width="5" stroke-linecap="round"/>\
</svg>') center/cover;
  transform: rotate(0deg);
  transition: transform .05s linear;
}

#bars {
  display: flex;
  gap: 4.5vmin;
  margin: 3vmin 0 0;
}

.barCard {
  width: 28vmin;
  min-width: 95px;
  display: flex;
  flex-direction: column;
  gap: 1.2vmin;
  align-items: center;
}

.barLabel {
  font-size: 3.1vmin;
  color: var(--muted);
  font-weight: 600;
}

.bar {
  height: 21vmin;
  width: 100%;
  max-height: 125px;
  border-radius: 2.5vmin;
  border: 2px solid #3c4b79;
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, #121a2d 0%, #0d1323 100%);
}

.fill {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0;
  background: linear-gradient(180deg, #75b0ff 0%, #2f77ff 100%);
}

#brake.fill {
  background: linear-gradient(180deg, #ff95a4 0%, #ff536e 100%);
}

#buttons {
  position: fixed;
  right: 6vmin;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 10vmin);
  width: 46vmin;
  height: 46vmin;
  max-width: 230px;
  max-height: 230px;
  pointer-events: none;
}

.btn {
  position: absolute;
  width: 16vmin;
  height: 16vmin;
  max-width: 82px;
  max-height: 82px;
  border-radius: 50%;
  background: linear-gradient(180deg, #263157 0%, #1a2342 100%);
  border: 2px solid #465688;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 7vmin;
  font-weight: 700;
  color: #fff;
  user-select: none;
  touch-action: none;
  pointer-events: auto;
  transition: background .12s, transform .07s;
  box-shadow: 0 7px 18px rgba(0, 0, 0, .3);
}

.btn.down {
  background: linear-gradient(180deg, #4a7fff 0%, #2f64e2 100%);
  transform: scale(.93);
}

#btnY { top: 0; left: 50%; transform: translate(-50%, -50%); }
#btnB { top: 50%; left: 100%; transform: translate(-50%, -50%); }
#btnA { top: 100%; left: 50%; transform: translate(-50%, -50%); }
#btnX { top: 50%; left: 0; transform: translate(-50%, -50%); }

#statusWrap {
  position: fixed;
  left: 12px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 60vw;
}

#status {
  font-size: 3.2vmin;
  background: rgba(16, 23, 41, .78);
  border: 1px solid #314067;
  border-radius: 999px;
  padding: 1.2vmin 2.4vmin;
  color: #d9e4ff;
  backdrop-filter: blur(6px);
}

#hint {
  font-size: 2.8vmin;
  color: var(--muted);
}

#calibrate {
  position: fixed;
  right: 12px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding: 2vmin 3.2vmin;
  border-radius: 999px;
  border: 2px solid #4d6196;
  background: linear-gradient(180deg, #27345c 0%, #1a2444 100%);
  color: #fff;
  font-size: 3.5vmin;
  font-weight: 650;
  letter-spacing: .01em;
  touch-action: manipulation;
}

#calibrate:active { transform: scale(.98); }

@media (max-height: 700px) {
  #wheelWrap {
    width: min(64vmin, 310px);
    height: min(64vmin, 310px);
  }

  #wheel {
    width: 55vmin;
    height: 55vmin;
  }
}
</style>
</head>
<body>

<div id="ui">
  <div id="topBar">
    <span class="groupLabel">Session</span>
    <div class="btnRow">
      <div id="btnStart" class="topBtn">▶</div>
      <div id="btnPause" class="topBtn">⏸</div>
    </div>
  </div>

  <div id="wheelWrap">
    <div id="wheel"></div>
  </div>

  <div id="bars">
    <div class="barCard">
      <div class="barLabel">Throttle</div>
      <div class="bar"><div id="throttle" class="fill"></div></div>
    </div>
    <div class="barCard">
      <div class="barLabel">Brake</div>
      <div class="bar"><div id="brake" class="fill"></div></div>
    </div>
  </div>
</div>

<div id="buttons">
  <div id="btnY" class="btn">Y</div>
  <div id="btnB" class="btn">B</div>
  <div id="btnA" class="btn">A</div>
  <div id="btnX" class="btn">X</div>
</div>

<div id="statusWrap">
  <div id="status">connecting…</div>
  <div id="hint">Tap once to enable gyro controls</div>
</div>
<button id="calibrate" type="button">Recenter</button>

<script src="app.js"></script>
</body>
</html>
